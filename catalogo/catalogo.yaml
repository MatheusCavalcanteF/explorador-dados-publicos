      - [21, Z00, Z99, "Fatores que influenciam o estado de saúde e o contato com os serviços de saúde"]
      - [22, U04, U99, "Códigos para propósitos especiais"]

# Cruzamentos publicáveis do SIH, um arquivo por ano. A mãe vem antes das filhas. "mae": uma célula
# oculta na mãe esconde as filhas da mesma chave. "herda_trimestre_de": o trimestre fica oculto se algum
# mês dele estiver oculto na tabela mensal. Um trimestre só aparece com os três meses na base: no ano
# corrente, o que ainda não terminou fica fora do arquivo, mas a supressão o trata como publicado, porque
# o ano menos os trimestres completos o devolve. O critério de cada ano está em supressao.criterio_publicacao.
cruzamentos:
  - { id: sih_res_ano, dimensoes: [municipio_residencia], tempo: ano, metricas: [internacoes, dias_permanencia, valor_total, obitos] }
  - { id: sih_hosp_ano, dimensoes: [municipio_hospital], tempo: ano, metricas: [internacoes, dias_permanencia, valor_total, obitos] }
  - { id: sih_res_mes, dimensoes: [municipio_residencia], tempo: mes, metricas: [internacoes, dias_permanencia, valor_total] }
  - { id: sih_hosp_mes, dimensoes: [municipio_hospital], tempo: mes, metricas: [internacoes, dias_permanencia, valor_total] }
  - { id: sih_res_mes_sexo, mae: sih_res_mes, dimensoes: [municipio_residencia, sexo], tempo: mes, metricas: [internacoes] }
  - { id: sih_res_mes_urgencia, mae: sih_res_mes, dimensoes: [municipio_residencia, urgencia], tempo: mes, metricas: [internacoes] }
  - { id: sih_res_mes_faixa5, mae: sih_res_mes, dimensoes: [municipio_residencia, faixa_5], tempo: mes, metricas: [internacoes] }
