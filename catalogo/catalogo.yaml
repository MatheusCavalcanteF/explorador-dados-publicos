# Catálogo: de onde vem cada número, a que tema pertence e o que a tela precisa dizer junto.
# Hash e data da coleta não ficam aqui: vêm do manifesto de cada execução.
versao: 1

# Limites do que é publicado. O build falha se um arquivo passar, e o erro aponta qual.
# KB e MB são decimais (1 KB = 1.000 bytes); MiB é binário. Ver "Limites de tamanho" no plano.
limites:
  # Sem compressão, por página. Definido em 08/11/2026 com folga: no build da coleta da execução
  # 42442355751, a maior página tinha 56,4 KB (a de MG, com 853 municípios), e a de município, 10,1 KB
  # de mediana. Reavaliar quando a página ganhar o SIH, com a medição nova.
  pagina_html_kb: 100
  # Qualquer arquivo do site, sem exceção: mantém a porta aberta para outro host.
  arquivo_mib: 25

temas:
  populacao: População
  saude: Saúde
  educacao: Educação
  economia: Economia
  trabalho: Trabalho
  financas_publicas: Finanças públicas
  agropecuaria: Agropecuária
  assistencia_social: Assistência social
  saneamento: Saneamento
  meio_ambiente: Meio ambiente
  eleicoes: Eleições
  seguranca: Segurança

# A API de serviços do IBGE (servicodados) não aceitou conexão do runner em 07/11/2026. Nenhuma base
# depende dela: a lista vem da DTB no geoftp, e a população e o período mais recente, da apisidra.
bases:
  ibge_dtb:
    nome: Divisão Territorial Brasileira
    orgao: IBGE
    licenca: { id: nao-declarada-na-origem, atribuicao: "IBGE, Divisão Territorial Brasileira" }
    coleta:
      origem: "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/"
      # Uma pasta por ano. Vale a mais recente que tiver o arquivo; pasta com outro .zip para o pipeline.
      arquivo: "{ano}/DTB_{ano}.zip"
      planilha: "RELATORIO_DTB_BRASIL*MUNICIPIO*.ods"
      colunas: [UF, Nome_UF, Código Município Completo, Nome_Município]
      data_base: "DATA BASE: dd/mm/aaaa, acima do cabeçalho"
      # A sigla da UF não vem na DTB: sai de uma tabela fixa do pipeline, conferida com Nome_UF.
    mudanca: hash_dos_valores   # código, nome e UF, comparados com a coleta anterior do manifesto
    ressalvas:
      - "A DTB descreve a divisão territorial na data-base e sai uma vez por ano. Mudança posterior, como um município novo, só entra na edição seguinte."
  ibge_estimativa:
    nome: Estimativas de População
    orgao: IBGE
    licenca: { id: nao-declarada-na-origem, atribuicao: "IBGE, Estimativas de População" }
    coleta:
      origem: "https://apisidra.ibge.gov.br/values/t/6579/n6/all/v/9324/p/last%201"   # a SIDRA diz o período mais recente
    mudanca: hash_dos_valores   # a SIDRA revisa estimativas; o hash compara com a coleta anterior
    # Valor que muda no mesmo período: a página ganha a ressalva "revisado pelo IBGE", com a data da
    # coleta que detectou, e o manifesto guarda antes e depois de cada município. Não bloqueia.
    revisao: { acao: marcar_revisado, aviso_variacao_pct: 5 }   # acima de 5%, aviso no workflow
    # Município na SIDRA que a DTB não tem para a coleta com erro claro (decisão de 08/11/2026).
    supressao: { aplica: false }   # população não é contagem de atendimentos
  ibge_censo_2022:
    nome: Censo Demográfico 2022
    orgao: IBGE
    licenca: { id: nao-declarada-na-origem, atribuicao: "IBGE, Censo Demográfico 2022" }
    coleta:
      origem: "https://apisidra.ibge.gov.br/values/t/4714/n6/all/v/93/p/2022"
    particao_fechada: { release: ibge-censo-2022, arquivo: censo-2022.json }
    mudanca: hash_dos_valores   # valor diferente do guardado na Release para o pipeline
    supressao: { aplica: false }

metricas:
  populacao_estimada:
    tema: populacao
    etiquetas: []
    base: ibge_estimativa
    rotulo: População estimada
    unidade: pessoas
    fonte:
      orgao: IBGE
      pesquisa: "Estimativas de População, tabela 6579 da SIDRA, variável 9324 (População residente estimada)"
      acesso:
        tipo: exato
        url: "https://apisidra.ibge.gov.br/values/t/6579/n6/{municipio}/v/9324/p/{periodo}"
      tabela: "https://sidra.ibge.gov.br/tabela/6579"
    ressalvas:
      - "É estimativa do IBGE, não contagem. A contagem mais recente é a do Censo 2022, logo abaixo."
  populacao_censo:
    tema: populacao
    etiquetas: []
    base: ibge_censo_2022
    rotulo: População no Censo 2022
    unidade: pessoas
    fonte:
      orgao: IBGE
      pesquisa: "Censo Demográfico 2022, tabela 4714 da SIDRA, variável 93 (População residente)"
      acesso:
        tipo: exato
        url: "https://apisidra.ibge.gov.br/values/t/4714/n6/{municipio}/v/93/p/2022"
      tabela: "https://sidra.ibge.gov.br/tabela/4714"
    ressalvas:
      - "Contagem feita em 2022. Um município da lista atual do IBGE sem dado no Censo aparece como ausente, nunca como zero."
