# Catálogo: de onde vem cada número, a que tema pertence e o que a tela precisa dizer junto.
# Hash e data da coleta não ficam aqui: vêm do manifesto de cada execução.
versao: 1

# Limites do que é publicado. O build falha se um arquivo passar, e o erro aponta qual.
# KB e MB são decimais (1 KB = 1.000 bytes); MiB é binário. Ver "Limites de tamanho" no plano.
limites:
  # Sem compressão, por página. Definido em 08/11/2026 com folga: no build da coleta da execução
  # 42442355751, a maior página tinha 56,4 KB (a de MG, com 853 municípios), e a de município, 10,1 KB
  # de mediana. Reavaliar quando a página ganhar o SIH, com a medição nova.
  pagina_html_kb: 100
  # Qualquer arquivo do site, sem exceção: mantém a porta aberta para outro host.
  arquivo_mib: 25

temas:
  populacao: População
  saude: Saúde
  educacao: Educação
  economia: Economia
  trabalho: Trabalho
  financas_publicas: Finanças públicas
  agropecuaria: Agropecuária
  assistencia_social: Assistência social
  saneamento: Saneamento
  meio_ambiente: Meio ambiente
  eleicoes: Eleições
  seguranca: Segurança

# A API de serviços do IBGE (servicodados) não aceitou conexão do runner em 07/11/2026. Nenhuma base
# depende dela: a lista vem da DTB no geoftp, e a população e o período mais recente, da apisidra.
bases:
  ibge_dtb:
    nome: Divisão Territorial Brasileira
    orgao: IBGE
    licenca: { id: nao-declarada-na-origem, atribuicao: "IBGE, Divisão Territorial Brasileira" }
    coleta:
      origem: "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/"
      # Uma pasta por ano. Vale a mais recente que tiver o arquivo; pasta com outro .zip para o pipeline.
      arquivo: "{ano}/DTB_{ano}.zip"
      planilha: "RELATORIO_DTB_BRASIL*MUNICIPIO*.ods"
      colunas: [UF, Nome_UF, Código Município Completo, Nome_Município]
      data_base: "DATA BASE: dd/mm/aaaa, acima do cabeçalho"
      # A sigla da UF não vem na DTB: sai de uma tabela fixa do pipeline, conferida com Nome_UF.
    mudanca: hash_dos_valores   # código, nome e UF, comparados com a coleta anterior do manifesto
    ressalvas:
      - "A DTB descreve a divisão territorial na data-base e sai uma vez por ano. Mudança posterior, como um município novo, só entra na edição seguinte."
  ibge_estimativa:
    nome: Estimativas de População
    orgao: IBGE
    licenca: { id: nao-declarada-na-origem, atribuicao: "IBGE, Estimativas de População" }
    coleta:
      origem: "https://apisidra.ibge.gov.br/values/t/6579/n6/all/v/9324/p/last%201"   # a SIDRA diz o período mais recente
    mudanca: hash_dos_valores   # a SIDRA revisa estimativas; o hash compara com a coleta anterior
    # Valor que muda no mesmo período: a página ganha a ressalva "revisado pelo IBGE", com a data da
    # coleta que detectou, e o manifesto guarda antes e depois de cada município. Não bloqueia.
    revisao: { acao: marcar_revisado, aviso_variacao_pct: 5 }   # acima de 5%, aviso no workflow
    # Município na SIDRA que a DTB não tem para a coleta com erro claro (decisão de 08/11/2026).
    supressao: { aplica: false }   # população não é contagem de atendimentos
  sih:
    nome: Sistema de Informações Hospitalares do SUS (AIH Reduzida)
    orgao: Ministério da Saúde / DATASUS
    # O FTP não declara licença. O site do ministério declara CC BY-ND 3.0 para o próprio conteúdo e
    # "licença aberta" para dados abertos, sem dizer qual vale para estes arquivos.
    licenca: { id: nao-declarada-na-origem, atribuicao: "Ministério da Saúde/DATASUS, SIH/SUS" }
    # Até o OK do dono do projeto, nada do SIH vai para o site nem para as Releases: o pipeline roda,
    # mede e testa, e os agregados ficam no runner.
    publicacao: { site: false, releases: false }
    coleta:
      origem: "ftp://ftp.datasus.gov.br/dissemin/publicos/SIHSUS/200801_/Dados"
      padrao: "RD{uf}{aamm}.dbc"
      # Só estas colunas saem do .dbf. CEP, nascimento e CPFs nunca são lidos.
      colunas: [N_AIH, ANO_CMPT, MES_CMPT, IDENT, CNES, MUNIC_MOV, MUNIC_RES, DIAG_PRINC, DT_INTER, DT_SAIDA,
                DIAS_PERM, VAL_TOT, MORTE, ESPEC, CAR_INT, SEXO, IDADE, COD_IDADE, RACA_COR]
      so_para_validar: [N_AIH]     # confere a chave dentro do arquivo e não chega ao Parquet mínimo
      so_para_conferir: [DT_INTER] # eixo do TabNet; nenhum agregado publicado usa
      todas_as_ufs: true           # a residência depende de internações em outros estados
      primeiro_ano: 2021
    tempo:
      eixo: mes_da_alta            # DT_SAIDA, incorporando o processamento tardio
      janela_republicada_meses: 12
      defasagem_maxima_meses: 5    # o mês M fecha quando M + 5 <= última competência - 12
    # Meses em que 99% ou mais das altas já foram processadas, medido nas competências de 2025.
    maturacao:
      meses_padrao: 3
      por_uf: { AL: 6, BA: 4 }
    revisao:
      municipio: { queda_pct: 30, minimo_internacoes: 100, acao: marcar_em_revisao }
      publicacao: { queda_uf_competencia_pct: 5, acao: manter_site_anterior }
    supressao:
      aplica: true
      k: 5
      contagens: [aihs, internacoes]  # oculta se qualquer uma estiver entre 1 e k-1
      nao_publicar: [aihs]            # a diferença entre as duas seria outra contagem pequena
      complementar: true
      familia: true
      # Publicar o motivo de cada célula oculta (contagem pequena, complementar, família) dá a quem tenta
      # deduzir os limites de cada uma. Medido em 08/11/2026, SIH 2025 do Brasil: com o motivo público, o
      # teste revela 4.365 contagens, e o reforço empaca em cerca de 365; sem o motivo, a mesma supressão
      # revela 1, e uma rodada de reforço chega a zero com 39 células a mais. Decidido em 08/11/2026: o
      # motivo não é publicado. Toda célula oculta aparece igual no gráfico, na tabela, no CSV e no PNG,
      # sem texto que diga o intervalo dela; a regra fica explicada em "Fonte e método".
      motivo_por_celula: false
      # Rodadas do reforço guiado pelo teste. Na medição entre versões de 08/11/2026, 14 das 16 versões
      # montadas chegaram a zero em até 6 rodadas; as outras 2 são o mesmo estado (2026 com as competências
      # até 2605), que chegou a zero na 10ª. O pipeline para assim que o teste dá zero.
      reforco_max_rodadas: 15
      # Margens que a complementar protege: as publicadas e as que saem de outra tabela publicada
      # ("conhecidas"), ou toda soma de uma coluna ("todas"). Medido em 08/11/2026 (2021, 2025 e 2026):
      # as duas passam no teste de dedução depois do reforço; "conhecidas" oculta de 10% a 12% menos
      # células e tira 2025 inteiro do limite de 5% das internações ocultas.
      margens_complementar: conhecidas
      # Critério para publicar um cruzamento num ano, depois da supressão: no máximo estas parcelas das
      # internações e das células da tabela ocultas, e zero no teste de dedução. O que reprova não é
      # publicado naquele ano, com o motivo na página; o que dependia dele (mãe ou trimestre) sai junto.
      criterio_publicacao: { internacoes_ocultas_pct_max: 5, celulas_ocultas_pct_max: 50 }
    # Meses preliminares (decidido em 08/11/2026). Uma atualização mensal com valores exatos revela, pela
    # diferença entre versões, de 62 a 194.045 grupos de 1 a 4 internações (medido em 08/11/2026). Por
    # isso, enquanto o período tiver um mês ainda não fechado (o mês, o trimestre dele ou o ano aberto),
    # cada contagem visível sai arredondada para múltiplo deste valor e marcada como preliminar e
    # arredondada. Zero continua zero, e oculta continua oculta. Taxas usam o valor arredondado. Dias de
    # permanência e valor pago não são contagem de pessoas e saem exatos, marcados como preliminares.
    preliminares: { arredondar_multiplo: 5, contagens: [internacoes, obitos] }
    # Versões (decidido em 08/11/2026). Quem guarda duas versões do site cruza uma com a outra: medido em
    # 2024, o fechamento do ano revelava 18 contagens assim.
    versoes:
      # Nas células de período fechado, a versão nova herda o padrão da publicada: a oculta continua
      # oculta, e a visível e exata não vira complementar (sih.fixas_da_anterior).
      herdar_padrao_fechado: true
      # Antes de toda publicação, o teste ataca a versão no ar e a candidata juntas. Se ele não rodar, se
      # revelar alguma contagem, ou se a versão no ar não puder ser lida ou não bater com a situação dela,
      # nada é publicado e o site anterior fica no ar. A etapa é pipeline/sih_versoes.py: roda em cada ano
      # que a versão no ar tem, em internações e em óbitos, e o ano que não passa não vira partição.
      ataque_conjunto_obrigatorio: true
      # Em ano aberto, o que é publicado de cada cruzamento fica o da primeira publicação daquele ano até o
      # ano fechar, sem refazer o critério a cada mês. A única exceção é o teste de dedução revelar algo
      # com o cruzamento, que sempre o tira.
      situacao_fixa_no_ano_aberto: true
    ressalvas:
      - "Só SUS. Internações particulares e por plano de saúde não aparecem."
      - "Os meses são os da data da alta. No TabNet, \"atendimento\" é a data de internação, e os meses não coincidem."
  ibge_censo_2022:
    nome: Censo Demográfico 2022
    orgao: IBGE
    licenca: { id: nao-declarada-na-origem, atribuicao: "IBGE, Censo Demográfico 2022" }
    coleta:
      origem: "https://apisidra.ibge.gov.br/values/t/4714/n6/all/v/93/p/2022"
    particao_fechada: { release: ibge-censo-2022, arquivo: censo-2022.json }
    mudanca: hash_dos_valores   # valor diferente do guardado na Release para o pipeline
    supressao: { aplica: false }

metricas:
  populacao_estimada:
    tema: populacao
    etiquetas: []
    base: ibge_estimativa
    rotulo: População estimada
    unidade: pessoas
    fonte:
      orgao: IBGE
      pesquisa: "Estimativas de População, tabela 6579 da SIDRA, variável 9324 (População residente estimada)"
      acesso:
        tipo: exato
        url: "https://apisidra.ibge.gov.br/values/t/6579/n6/{municipio}/v/9324/p/{periodo}"
      tabela: "https://sidra.ibge.gov.br/tabela/6579"
    ressalvas:
      - "É estimativa do IBGE, não contagem. A contagem mais recente é a do Censo 2022, logo abaixo."
  populacao_censo:
    tema: populacao
    etiquetas: []
    base: ibge_censo_2022
    rotulo: População no Censo 2022
    unidade: pessoas
    fonte:
      orgao: IBGE
      pesquisa: "Censo Demográfico 2022, tabela 4714 da SIDRA, variável 93 (População residente)"
      acesso:
        tipo: exato
        url: "https://apisidra.ibge.gov.br/values/t/4714/n6/{municipio}/v/93/p/2022"
      tabela: "https://sidra.ibge.gov.br/tabela/4714"
    ressalvas:
      - "Contagem feita em 2022. Um município da lista atual do IBGE sem dado no Censo aparece como ausente, nunca como zero."
  internacoes:
    tema: saude
    etiquetas: []
    base: sih
    rotulo: Internações
    unidade: internações
    sinonimos: [internação, hospitalização, baixa hospitalar]
    regra: "AIH com IDENT = 1; as de IDENT = 5 são prorrogações da mesma internação"
    fonte:
      orgao: Ministério da Saúde / DATASUS
      pesquisa: "SIH/SUS, AIH Reduzida (arquivos RD por UF e competência)"
      acesso:
        tipo: receita
        url: "http://tabnet.datasus.gov.br/cgi/deftohtm.exe?sih/cnv/nrbr.def"
        receita: "Linha: Município; Conteúdo: Internações; Períodos disponíveis: as competências do ano"
    conferencia: { ferramenta: TabNet, medida: "Internações", eixos: [competencia, data_de_internacao] }
    ressalvas:
      - "Conta internações, não pessoas: quem foi internado duas vezes conta duas."
  dias_permanencia:
    tema: saude
    etiquetas: []
    base: sih
    rotulo: Dias de permanência
    unidade: dias
    regra: "soma de DIAS_PERM de todas as AIHs, inclusive as prorrogações"
    fonte:
      orgao: Ministério da Saúde / DATASUS
      pesquisa: "SIH/SUS, AIH Reduzida (arquivos RD por UF e competência)"
      acesso:
        tipo: receita
        url: "http://tabnet.datasus.gov.br/cgi/deftohtm.exe?sih/cnv/nrbr.def"
        receita: "Linha: Município; Conteúdo: Dias de permanência; Períodos disponíveis: as competências do ano"
    ressalvas:
      - "A média de permanência divide estes dias pelas internações, não pelas AIHs."
  valor_total:
    tema: saude
    etiquetas: [financas_publicas]
    base: sih
    rotulo: Valor pago
    unidade: reais
    regra: "soma de VAL_TOT"
    fonte:
      orgao: Ministério da Saúde / DATASUS
      pesquisa: "SIH/SUS, AIH Reduzida (arquivos RD por UF e competência)"
      acesso:
        tipo: receita
        url: "http://tabnet.datasus.gov.br/cgi/deftohtm.exe?sih/cnv/nrbr.def"
        receita: "Linha: Município; Conteúdo: Valor total; Períodos disponíveis: as competências do ano"
    ressalvas:
      - "É o valor pago pela tabela SIGTAP, não o custo do hospital."
      - "O ticket médio exclui as AIHs de valor zero, quase todas de leitos de saúde mental."
  obitos:
    tema: saude
    etiquetas: []
    base: sih
    rotulo: Óbitos hospitalares
    unidade: óbitos
    regra: "soma de MORTE"
    cruzamentos: [sih_res_ano, sih_hosp_ano]   # só o total anual por município
    fonte:
      orgao: Ministério da Saúde / DATASUS
      pesquisa: "SIH/SUS, AIH Reduzida (arquivos RD por UF e competência)"
      acesso:
        tipo: receita
        url: "http://tabnet.datasus.gov.br/cgi/deftohtm.exe?sih/cnv/nrbr.def"
        receita: "Linha: Município; Conteúdo: Óbitos; Períodos disponíveis: as competências do ano"
    ressalvas:
      - "Hospitais de referência recebem os casos mais graves. A taxa sozinha não mede qualidade."
  taxa_internacao:
    tema: saude
    etiquetas: [populacao]
    rotulo: Internações por mil habitantes
    formula: "internacoes / populacao_estimada * 1000"
    fontes: [internacoes, populacao_estimada]   # calculada: cada parcela traz a própria fonte
    oculta_se: [internacoes]                     # herda a máscara do numerador

# Dimensões dos cruzamentos do SIH. "niveis" vai do mais fino ao mais grosso: somar uma dimensão é
# subir um nível, e o teste de dedução considera todas as somas que alguém pode montar.
dimensoes:
  municipio_residencia: { base: sih, niveis: [mun_res, uf_res], conversao: ibge6_para_ibge7 }
  municipio_hospital: { base: sih, niveis: [mun_hosp, uf_hosp], conversao: ibge6_para_ibge7 }
  # SEXO no RD, como no SEXO.CNV do TabWin (TAB_SIH.zip, pasta Auxiliar do FTP, de 15/10/2026): 1 é
  # masculino; 2 e 3, feminino; qualquer outro código vai para "Ignorado". O SQL das tabelas sai daqui.
  sexo:
    base: sih
    niveis: [sexo]
    valores: [M, F, I]
    codigos: { "1": M, "2": F, "3": F }
    outros: I
    rotulos: { M: Masculino, F: Feminino, I: Ignorado }
    # O que foi achado sobre o código 4, lido em 08/11/2026, sem atribuir significado a ele:
    fora_do_dicionario:
      "4":
        visto: >-
          Aparece a partir da competência 2606: 182 AIHs nas competências 2606 e 2607, de 133 municípios de
          residência em 24 UFs, todas internações, com alta entre 26/02/2026 e 31/07/2026. Com a 2608, que
          ainda não tem AC e RR, são 276 AIHs de 194 municípios.
        documentacao: >-
          Nenhum documento oficial lido define o código 4 no RD. O layout da reduzida (Layout_REDUZIDA.pdf,
          SIHD, de 2012) lista só 1 = masculino e 3 = feminino; o informe técnico do FTP (IT_SIHSUS_1603.pdf)
          diz só "Sexo do paciente"; o SEXO.CNV do TabWin manda todo código fora de 1, 2 e 3 para
          "Ignorado". Na captação, o layout do SISAIH01 lista M e F até a competência 12/2025 e passa a
          listar também "I- Indeterminado" a partir da 01/2026 (layouts de 01/2026 e 07/2026, no FTP do
          SIHD). Nenhum documento liga esse "I" ao código 4 do RD, e os avisos do SIHD de 2025 e 2026 não
          falam de mudança no sexo.
        tratamento: >-
          Vai para "Ignorado", como no TabWin. A categoria não é retirada: o total de outra tabela a
          devolveria por subtração.
  faixa_12:
    base: sih
    niveis: [faixa12, faixa5]
    valores: ["00", "01-04", "05-09", "10-14", "15-19", "20-29", "30-39", "40-49", "50-59", "60-69", "70-79", "80+", ign]
  faixa_5: { base: sih, niveis: [faixa5], valores: [00-14, 15-29, 30-49, 50-69, 70+, ign], aninhada_em: faixa_12 }
  capitulo_cid: { base: sih, niveis: [capitulo] }
  urgencia: { base: sih, niveis: [urgencia], valores: [urgencia, demais] }
  carater: { base: sih, niveis: [carater, urgencia], valores: [eletivo, urgencia, outros] }
  raca_cor: { base: sih, niveis: [raca] }
  especialidade: { base: sih, niveis: [espec] }

