# Diagnóstico manual: cada fonte do plano, passo a passo (DNS, conexão, TLS ou FTP, resposta), com tempo curto.
# Uma fonte fora não interrompe as outras. Não publica nada: o resultado vai para o resumo da execução e
# para um artefato de 7 dias. O mesmo comando roda numa máquina local, para comparar.
# As fontes do roteiro depois da v1 aparecem numa tabela à parte: são informativas, e nenhuma etapa
# depende delas.
name: Alcance das fontes

on:
  workflow_dispatch:
    inputs:
      inep:
        # Fora por padrão: o workflow INEP diário testa se pedidos repetidos levam à recusa, e cada
        # pedido a mais mudaria o teste.
        description: "Incluir o INEP (6 pedidos)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INCLUIR_INEP: ${{ inputs.inep }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Diagnóstico
        run: |
          pular=()
          if [ "$INCLUIR_INEP" != "true" ]; then pular=(--pular inep); fi
          python -m pipeline diagnostico --saida build/diagnostico --resumo "$GITHUB_STEP_SUMMARY" "${pular[@]}"

      # Conferência independente do Python nas rotas do IBGE e, se pedido, no INEP. No INEP, com e sem a
      # chave híbrida no ClientHello, para separar recusa ao runner de recusa ao ClientHello grande.
      - name: curl nas rotas do IBGE e no INEP
        if: always()
        run: |
          medir() {
            saida=0
            linha=$(curl -sS -o /dev/null --compressed --connect-timeout 10 --max-time 60 \
              -w '%{remote_ip} | %{time_namelookup} | %{time_connect} | %{time_appconnect} | %{time_starttransfer} | %{time_total} | %{http_code}' \
              "$@" 2> curl-erro.txt) || saida=$?
            echo "| $* | $linha | $saida $(tr '\n|' '  ' < curl-erro.txt | head -c 160) |"
          }
          inep="https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2024.zip"
          mkdir -p build/diagnostico
          # Também no artefato, porque o resumo da execução não sai pela API.
          {
            echo "### curl nas rotas do IBGE e no INEP"
            echo ""
            curl --version | head -1
            echo ""
            echo "| Pedido | IP | DNS | Conexão | TLS | Primeiro byte | Total | HTTP | Saída do curl |"
            echo "|---|---|---:|---:|---:|---:|---:|---|---|"
            medir "https://servicodados.ibge.gov.br/api/v1/localidades/municipios"
            medir "https://apisidra.ibge.gov.br/values/t/6579/n6/3548500/v/9324/p/last%201"
            medir "https://ftp.ibge.gov.br/Estimativas_de_Populacao/"
            medir "https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2025/"
            if [ "$INCLUIR_INEP" = "true" ]; then
              for tentativa in 1 2; do
                medir -r 0-1023 "$inep"
                medir -r 0-1023 --curves X25519 "$inep"
              done
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > build/diagnostico/curl.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostico
          path: build/diagnostico
          retention-days: 7
