# Coleta do IBGE, alcance das fontes, publicação no GitHub Pages e conferências no site publicado.
# Se a coleta ou o contrato falharem, nada é publicado e o site anterior continua no ar.
name: Publicar

on:
  # Religado em 07/11/2026, depois da execução manual 42439217829 completa, com a lista de municípios
  # pela DTB. O commit que muda o cron também reinicia a contagem de 60 dias sem atividade.
  schedule:
    # Semanal, em minuto quebrado: na virada da hora o agendamento atrasa ou é descartado.
    - cron: "47 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  EXECUCAO: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes (sem rede)
        run: python -m pytest

      # Uma consulta à lista de Releases. O que não está na lista não existe, e a execução segue: primeira
      # coleta do Censo. Se a consulta ou o download falhar, o passo para: seguir sem a partição congelada do
      # Censo trocaria o publicado sem aviso. Nada do SIH vai para Releases.
      - name: Release do Censo 2022 (partição fechada, se existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline releases --destino build/release

      # Lista pela DTB do geoftp e população pela SIDRA. O manifesto da coleta anterior, no git,
      # serve para dizer o que mudou, pelo hash dos valores. Se a estimativa mudar no mesmo período,
      # a coleta lê o Parquet do site no ar para achar os municípios revisados; variação acima do
      # limite do catálogo vira aviso nesta execução, sem bloquear.
      - name: Coleta do IBGE
        run: >
          python -m pipeline coletar --saida build/coleta --censo-release build/release/censo-2022.json
          --anterior manifesto/ibge.json

      - name: Alcance das outras fontes
        run: python -m pipeline alcance --saida build/coleta

      # O SIH só roda aqui quando o catálogo mandar publicar (bases.sih.publicacao); hoje não manda, e os
      # três passos seguintes são pulados. Quando rodar, a versão anterior é a que está no ar: a superfície
      # publicada com o site, baixada e conferida no passo "no-ar" (404 com o site respondendo é a primeira
      # publicação; qualquer outra falha para). A nova herda o padrão dela e cada ano passa pelo ataque
      # conjunto, com os dois motores. Um ano reprovado para o job antes do site, e o site anterior continua no
      # ar. A superfície aprovada fica em build/sih, que não é artefato: levá-la ao site é outra etapa, ainda
      # não feita.
      - name: O catálogo manda publicar o SIH?
        id: sih
        run: python -m pipeline publicacao --base sih >> "$GITHUB_OUTPUT"

      - name: Versão no ar do SIH (a superfície publicada no site)
        if: steps.sih.outputs.publicar == 'true'
        run: python -m pipeline no-ar --destino build/no-ar

      - name: Dependências do SIH
        if: steps.sih.outputs.publicar == 'true'
        run: pip install -r requirements-sih.txt

      - name: SIH, com a versão no ar como anterior
        if: steps.sih.outputs.publicar == 'true'
        run: >
          python -m pipeline sih --coleta build/coleta --trabalho build/sih --saida build/sih-medicao
          --no-ar build/no-ar

      - name: Site
        run: |
          python -m pipeline construir --coleta build/coleta --saida build/site --links manifesto/links.json --execucao "$EXECUCAO"
          # Os arquivos que a conferência compara byte a byte com o que o site servir
          mkdir -p build/coleta/site/dados/ibge build/coleta/site/municipio/3548500
          cp build/site/dados/ibge/populacao.parquet build/coleta/site/dados/ibge/
          cp build/site/municipio/3548500/index.html build/coleta/site/municipio/3548500/
          cp build/site/sitemap.xml build/coleta/site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      - uses: actions/upload-artifact@v7
        with:
          name: coleta
          path: build/coleta
          retention-days: 7

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  conferir:
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ferramentas/leitor/package-lock.json

      - name: Instalar o leitor em JavaScript
        run: npm ci --prefix ferramentas/leitor

      - uses: actions/download-artifact@v8
        with:
          name: coleta
          path: build/coleta

      # Também confere que o deploy publicou no endereço de projeto.yaml, para onde apontam o link
      # canônico, o sitemap e o JSON-LD.
      - name: Hospedagem no site publicado (endereço, gzip, Range, HEAD, página, sitemap)
        continue-on-error: true
        run: python -m pipeline hospedagem --coleta build/coleta --site build/coleta/site --url "${{ needs.publicar.outputs.url }}" --execucao "$EXECUCAO"

      - name: Leitor em JavaScript no site publicado
        continue-on-error: true
        run: node ferramentas/leitor/conferir.mjs "${{ needs.publicar.outputs.url }}dados/ibge/populacao.parquet?conferencia=$EXECUCAO" build/coleta/ibge.json build/coleta/leitor.json

      # Separada dos testes, que não usam rede. Link quebrado fica marcado no manifesto e não impede a publicação.
      - name: Links oficiais
        continue-on-error: true
        run: python -m pipeline links --coleta build/coleta

      - name: Release do Censo 2022, na primeira coleta
        if: hashFiles('build/coleta/censo-2022.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ibge-censo-2022 build/coleta/censo-2022.json
          --title "IBGE, Censo 2022: população por município"
          --notes "Partição fechada: população residente do Censo 2022 (SIDRA, tabela 4714, variável 93), como coletada pelo pipeline. As execuções seguintes leem este arquivo e só o conferem com a fonte; se a fonte mudar, o pipeline para em vez de substituí-lo."

      - name: Manifesto no git
        run: |
          python -m pipeline manifesto --coleta build/coleta --saida manifesto
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifesto
          if git diff --cached --quiet; then
            echo "Manifesto sem mudança"
            exit 0
          fi
          git commit -m "dados: manifesto da coleta de $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Falhas de alcance, hospedagem ou leitor
        run: python -m pipeline exigir --coleta build/coleta
