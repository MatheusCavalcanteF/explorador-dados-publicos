# Origem: Dados-Hospitalares-SUS, commit 52edc79, adaptado. Testes sem rede a cada push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-sih.txt

      # requirements-sih.txt inclui requirements.txt. O datasus-dbc compila no Python 3.14.
      - name: Instalar dependências
        run: pip install -r requirements-sih.txt

      # Com EXIGIR_SIH=1, faltar dependência do SIH é erro: nenhum teste dele fica de fora sem aviso.
      - name: Rodar testes
        env:
          EXIGIR_SIH: "1"
        run: python -m pytest

      # Fica fora do requirements.txt: só o CI precisa dele
      - name: Auditar dependências (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
          pip-audit -r requirements-sih.txt
