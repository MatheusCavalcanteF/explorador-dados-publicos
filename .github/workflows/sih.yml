# SIH no runner, só para medir: tempo, disco, memória e tamanho das partições, com o teste de dedução e o ataque
# conjunto. Disparo manual apenas, sem agendamento. Nada vai para o site (o catálogo diz publicacao: {site: false}),
# e nada do SIH vai para Releases. O único artefato é a medição: tempos, tamanhos, memória e contagens agregadas.
# Os .dbc, o Parquet mínimo (uma linha por AIH), as partições e a superfície ficam nas pastas de trabalho e somem
# com o runner: a superfície também é dado do SIH, e publicá-la, mesmo como artefato, depende do OK do dono.
# O ano que não passa no teste de dedução não vira partição, e o passo fica vermelho. Numa UF sozinha isso é
# esperado: o teste só vale com as 27. A medição é guardada do mesmo jeito.
#
# Com `ciclo`, mede três versões seguidas, com as 27 UFs, no mesmo job:
#   a. a primeira publicação, sem versão anterior: coleta de tudo e cada ano calculado;
#   b. a versão seguinte, com a superfície de "a" como versão no ar e o reaproveitamento: os anos fechados são
#      copiados dela, só as competências dos abertos são baixadas do FTP, e o ataque conjunto roda nos abertos;
#   c. a mesma, com --sem-reaproveitar, como depois de uma mudança de regra: todos os anos recalculados, com o
#      ataque conjunto em cada um. Os .dbc vêm da coleta de "a", então o tempo de "c" não inclui download.
# Cada fase tem o tempo que sobrar do limite de 6 h por job, menos 10 min para guardar a medição.
name: SIH (medição)

on:
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs separadas por espaço, ou todas para as 27"
        required: false
        default: "RR"
      anos:
        description: "Anos da alta separados por espaço; vazio mede todos a partir do primeiro do catálogo"
        required: false
        default: ""
      deducao:
        description: "Rodar o teste de dedução com reforço"
        type: boolean
        default: true
      ciclo:
        description: "Medir também a versão seguinte, com e sem reaproveitamento (exige todas e a dedução)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sih
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UFS: ${{ inputs.ufs }}
      ANOS: ${{ inputs.anos }}
      DEDUCAO: ${{ inputs.deducao }}
      CICLO: ${{ inputs.ciclo }}
    steps:
      # O checkout limpa a pasta de trabalho: nada é gravado em build/ antes dele.
      - uses: actions/checkout@v7

      - name: Início, máquina e memória amostrada a cada 5 s
        run: |
          date +%s > "$RUNNER_TEMP/inicio"
          if [ "$CICLO" = "true" ] && { [ "$UFS" != "todas" ] || [ "$DEDUCAO" != "true" ]; }; then
            echo "::error::O ciclo precisa das 27 UFs (ufs = todas) e do teste de dedução: sem eles não há superfície nem reaproveitamento"
            exit 1
          fi
          mkdir -p build/sih-medicao
          { nproc; free -m; df -B1 --output=avail,size . | tail -1; } | tee build/sih-medicao/maquina_antes.txt
          # Memória em uso na máquina inteira (MemTotal - MemAvailable, em kB), com o horário.
          cat > "$RUNNER_TEMP/memoria.sh" <<'SH'
          while true; do
            echo "$(date +%s) $(awk '/^MemTotal:/{t=$2} /^MemAvailable:/{a=$2} END{print t-a}' /proc/meminfo)"
            sleep 5
          done
          SH
          nohup bash "$RUNNER_TEMP/memoria.sh" > build/sih-medicao/memoria.txt 2>/dev/null &
          # Uma fase: marca início e fim, mede com /usr/bin/time e para no tempo que sobra do job.
          cat > "$RUNNER_TEMP/fase.sh" <<'SH'
          nome=$1; shift
          mkdir -p "build/sih-medicao/$nome"
          restante=$(( 360 * 60 - 600 - ($(date +%s) - $(cat "$RUNNER_TEMP/inicio")) ))
          echo "$nome inicio $(date +%s) $restante $(df -B1 --output=avail . | tail -1)" >> build/sih-medicao/fases.txt
          medir=(); if [ -x /usr/bin/time ]; then medir=(/usr/bin/time -v -o "build/sih-medicao/$nome/time.txt"); fi
          timeout -s TERM "$restante" "${medir[@]}" "$@"; codigo=$?
          echo "$nome fim $(date +%s) $codigo $(df -B1 --output=avail . | tail -1)" >> build/sih-medicao/fases.txt
          du -sb build/sih-* 2>/dev/null | sed "s/^/$nome /" >> build/sih-medicao/disco.txt
          exit $codigo
          SH

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-sih.txt

      - name: Instalar dependências (o datasus-dbc compila no Python 3.14)
        run: |
          inicio=$(date +%s)
          pip install -r requirements-sih.txt
          echo "instalacao_s=$(( $(date +%s) - inicio ))" | tee build/sih-medicao/instalacao.txt

      # A lista de municípios vem da DTB, como no Publicar. Nenhum dado do IBGE vira artefato aqui.
      - name: Lista de municípios
        run: python -m pipeline coletar --saida build/coleta --anterior manifesto/ibge.json

      - name: "SIH, versão a: primeira publicação"
        run: |
          args=(--coleta build/coleta --trabalho build/sih-a --saida build/sih-medicao/a --processos 4 --progresso-lp)
          # Campo vazio no disparo volta ao padrão (RR), então as 27 UFs têm um valor próprio.
          if [ "$UFS" != "todas" ]; then args+=(--ufs $UFS); fi
          if [ -n "$ANOS" ]; then args+=(--anos $ANOS); fi
          if [ "$DEDUCAO" != "true" ]; then args+=(--sem-deducao); fi
          # Os .dbc ficam para a versão c, que mede o cálculo sem baixar de novo.
          if [ "$CICLO" = "true" ]; then args+=(--manter-dbc); fi
          bash "$RUNNER_TEMP/fase.sh" a python -m pipeline sih "${args[@]}"
          # A versão a só precisa deixar a superfície (a "versão no ar" de b e c) e os .dbc.
          rm -rf build/sih-a/min build/sih-a/particoes

      - name: "SIH, versão b: a seguinte, com os anos fechados copiados da a"
        if: inputs.ciclo
        run: |
          args=(--coleta build/coleta --trabalho build/sih-b --saida build/sih-medicao/b --processos 4 --progresso-lp
                --anterior build/sih-a/superficie.parquet)
          if [ -n "$ANOS" ]; then args+=(--anos $ANOS); fi
          bash "$RUNNER_TEMP/fase.sh" b python -m pipeline sih "${args[@]}"
          rm -rf build/sih-b

      - name: "SIH, versão c: a seguinte, sem reaproveitar, com os .dbc da a"
        if: inputs.ciclo
        run: |
          args=(--coleta build/coleta --trabalho build/sih-c --saida build/sih-medicao/c --processos 4 --progresso-lp
                --anterior build/sih-a/superficie.parquet --sem-reaproveitar --origem-local build/sih-a/dbc)
          if [ -n "$ANOS" ]; then args+=(--anos $ANOS); fi
          bash "$RUNNER_TEMP/fase.sh" c python -m pipeline sih "${args[@]}"

      - name: Resumo da memória e das fases
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pasta = Path("build/sih-medicao")
          amostras = []
          for linha in (pasta / "memoria.txt").read_text().splitlines() if (pasta / "memoria.txt").exists() else []:
              partes = linha.split()
              if len(partes) == 2 and all(p.isdigit() for p in partes):
                  amostras.append((int(partes[0]), int(partes[1])))
          fases = {}
          for linha in (pasta / "fases.txt").read_text().splitlines() if (pasta / "fases.txt").exists() else []:
              nome, marca, instante, valor, disco = linha.split()
              fases.setdefault(nome, {})[marca] = (int(instante), int(valor), int(disco))
          resumo = {"amostras_de_memoria": len(amostras),
                    "pico_memoria_em_uso_mb": round(max((m for _, m in amostras), default=0) / 1024), "fases": {}}
          for nome, f in fases.items():
              inicio, restante, livre_antes = f["inicio"]
              fim, codigo, livre_depois = f.get("fim", (None, None, None))
              durante = [m for t, m in amostras if inicio <= t <= (fim or t)]
              resumo["fases"][nome] = {"segundos": fim - inicio if fim else None, "codigo_de_saida": codigo,
                                       "limite_s": restante, "pico_memoria_em_uso_mb": round(max(durante, default=0) / 1024),
                                       "disco_livre_antes": livre_antes, "disco_livre_depois": livre_depois}
          (pasta / "resumo.json").write_text(json.dumps(resumo, indent=1))
          print(json.dumps(resumo, indent=1))
          PY
          { df -B1 --output=avail,size . | tail -1; du -sb build/sih-* 2>/dev/null; } | tee build/sih-medicao/disco_depois.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sih-medicao
          path: build/sih-medicao
          retention-days: 30
